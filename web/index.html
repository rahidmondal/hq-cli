<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="hq-token" content="__TOKEN__">
<title>hq</title>
<link rel="stylesheet" href="/_app/app.css">
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Pages">
    <a class="brand" href="/" data-nav="today"><span class="logo" aria-hidden="true">hq</span><span class="wordmark">hq</span></a>
    <div class="railtop">
      <button class="newbtn" type="button" data-act="new-task">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="label">New task</span><span class="key">n</span></button>
      <div class="areas" role="group" aria-label="Area">
        <button type="button" data-area="">All</button>
        <button type="button" data-area="work">Work</button>
        <button type="button" data-area="personal">Personal</button>
      </div>
    </div>
    <div class="navgroup">
      <a class="navlink" href="/" data-nav="today">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span class="label">Today</span><span class="badge" data-count="today"></span><span class="key">t</span></a>
      <a class="navlink" href="/board" data-nav="board">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg>
        <span class="label">Board</span><span class="badge" data-count="board"></span><span class="key">b</span></a>
      <a class="navlink" href="/goals" data-nav="goals">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg>
        <span class="label">Goals</span><span class="badge" data-count="goals"></span><span class="key">g</span></a>
      <a class="navlink" href="/calendar" data-nav="calendar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        <span class="label">Calendar</span><span class="key">c</span></a>
      <a class="navlink" href="/reading" data-nav="reading">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C6.5 4.5 9.5 4.5 12 6c2.5-1.5 5.5-1.5 8-.5V19c-2.5-1-5.5-1-8 .5-2.5-1.5-5.5-1.5-8-.5z"/><path d="M12 6v13.5"/></svg>
        <span class="label">Reading</span><span class="badge" data-count="reading"></span><span class="key">r</span></a>
      <a class="navlink" href="/inbox" data-nav="inbox">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13.5 6.5 5h11l2.5 8.5V19H4z"/><path d="M4 13.5h4.5l1 2h5l1-2H20"/></svg>
        <span class="label">Inbox</span><span class="badge" data-count="inbox"></span><span class="key">i</span></a>
    </div>
    <div class="railfoot">
      <p class="keys-help"><kbd>/</kbd> search <kbd>j</kbd><kbd>k</kbd> move <kbd>e</kbd> open <kbd>Esc</kbd> close</p>
      <div class="railmeta"><a class="classic-link" href="/classic">Classic board</a>
        <span class="version" title="hq version">v__VERSION__</span></div>
    </div>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>
<aside id="drawer" class="drawer" hidden aria-label="Details"></aside>
<div id="scrim" class="scrim" hidden></div>
<dialog id="dialog"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="/_marked.js"></script>
<script src="/_app/app.js"></script>
</body>
</html>
